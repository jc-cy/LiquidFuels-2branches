Liquid Fuels / 液体燃料 is a configuration-driven universal fluid fuel converter.

It adds small, medium, and large fuel tanks with 1000 mB, 5000 mB, and 20000 mB capacity.
Tank items and placed tank blocks expose standard NeoForge fluid capabilities for interaction with fluid containers, pipes, and other mods.
Players can define burnable fluids in the global config file config/liquidfuels-common.toml using exact fluid ids or #namespace:tag fluid tags.
Config values are burn ticks per 1000 mB; each fuel use consumes 100 mB and keeps the tank item.
JEI uses compact fluid-to-tank recipes for configured fuels that exist in the current game, with the approximate item burn count in the fluid tooltip.
The mod also supports inventory right-click fluid transfer and optional Immersive Aircraft fuel consumption compatibility.

