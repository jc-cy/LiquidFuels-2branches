displayName = "Liquid Fuels"
authors = "交错次元"
credits = "美术: witzig_heidi(鱼)"
description = '''Liquid Fuels / 液体燃料 是一个配置驱动的通用流体燃料转换模组。

它提供小油桶、中油桶、大油桶三种可携带、可放置的储液容器，容量分别为 1000 mB、5000 mB、20000 mB。
油桶物品与方块都暴露 NeoForge 标准流体能力，可与流体容器、管道和其他模组的流体系统交互。
玩家可以通过全局配置 config/liquidfuels-common.toml 声明可燃流体，支持精确流体 ID 与 #namespace:tag 流体标签。
配置值按每 1000 mB 的燃烧 tick 填写；实际作为燃料时每次消耗 100 mB，保留油桶本体。
JEI 使用紧凑的液体到油桶配方展示当前配置中实际存在的可燃流体，流体 tooltip 会显示约可烧炼物品数量。
模组还包含背包内右键倒液交互，并对 Immersive Aircraft 的燃料消费做可选兼容。

